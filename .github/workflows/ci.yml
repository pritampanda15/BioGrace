name: CI — Typecheck, Statistical Tests & Build

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run statistical & parser unit tests
        run: npm test
      - name: Typecheck & production build
        run: npm run build
      - name: Verify headless BioGrace CLI
        run: npm run cli -- demo stats --out /tmp/ci_raincloud.svg --report /tmp/ci_report.json
